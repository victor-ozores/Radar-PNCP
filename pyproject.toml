[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-licitacoes-pncp"
version = "0.1.0"
description = "Pipeline diário que busca licitações no PNCP, pontua por perfil e alerta no Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Amorim Ozores" }]
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# o `ruff format` cuida da quebra de linha; sobram só strings longas que não quebram
ignore = ["E501"]
