# Perfil de interesse do Radar. Edite este arquivo para mudar o que o robô procura.
# Nenhuma alteração de código é necessária.
#
# Termos de busca:
#  - Sem acento e em minúsculas (o robô normaliza o texto do edital antes de comparar).
#  - Um asterisco no fim de uma palavra aceita qualquer terminação: "obra*" casa com obra, obras.
#  - Frases com espaço são aceitas: "manutencao predial".

perfil:
  nome: "Construtora de médio porte (engenharia civil + manutenção predial)"
  descricao: >
    Perfil fictício inspirado no setor de orçamentos de uma empresa de engenharia.
    Calibre os termos com quem trabalha com propostas de verdade.

ingestao:
  ufs: [SP, RJ, MG, PR]
  # Códigos de modalidade do PNCP: 4 concorrência eletrônica, 5 concorrência presencial,
  # 6 pregão eletrônico, 7 pregão presencial. A 8 (dispensa) fica de fora até medir o volume.
  modalidades: [4, 5, 6, 7]
  lookback_dias: 3          # busca hoje e os 2 dias anteriores (cobre fim de semana e cron atrasado)
  # Alterações (prazo prorrogado, suspensão, revogação): hoje e ontem. A consulta devolve cerca de
  # 4x mais linhas que a de publicação (medido em 21/10/2026: 6.004 linhas em 3 dias), então o
  # período é menor. Se o robô ficar mais de 1 dia parado, rode `backfill` para recuperar.
  lookback_atualizacao_dias: 2
  tamanho_pagina: 50        # limite da API: 10 a 50
  intervalo_minimo_s: 4.0   # a API devolve 429 se for acionada rápido demais
  backoff_429_s: [30, 60, 120]
  max_tentativas_5xx: 4
  timeout_s: 60
  max_paginas_por_serie: 400

filtros:
  valor_min: 100000
  valor_max: 20000000

score:
  termos_fortes:
    - "obra*"
    - "reforma*"
    - "construcao"
    - "edificac*"
    - "manutencao predial"
    - "engenharia"
    - "instalacoes eletricas"
    - "instalacoes hidraulicas"
    - "climatizacao"
    - "impermeabilizacao"
    - "pavimentacao"
    - "demolicao"
    - "restauro"
    - "ampliacao"
    # Obras que o perfil deixava de fora (medido em 21/10/2026 nos editais abertos: 21 de
    # recapeamento, 15 de calçamento, 14 de muro de contenção/arrimo).
    - "recapeamento"
    - "calcamento"
    - "muro*"
    - "terraplenagem"
    - "rede coletora"
  termos_fracos:
    - "ar condicionado"
    - "elevador*"
    - "pintura"
    - "hidraulic*"
    - "gerador*"
    - "subestacao"
    - "spda"
    - "extintor*"
    - "telhado"
    - "cobertura"
    - "piso*"
    - "esquadria*"
    - "calcada*"
    - "terraplanagem"
  termos_negativos:
    - "medicamento*"
    - "uniforme*"
    - "genero* alimenticio*"
    - "merenda"
    - "material de expediente"
    - "material de escritorio"
    - "combustivel"
    - "combustiveis"
    - "passagem* aerea*"
    - "pneu*"
    - "material hospitalar"
    - "insumo* hospitalar*"
    - "exame* laboratorial*"
    - "fornecimento de energia"
    - "aquisic*"       # aquisição e aquisições (sem acento: aquisicao / aquisicoes)
    # Assuntos que casavam palavras do perfil sem ser obra (21/10/2026). Só termos específicos:
    # "veiculo", "residuo" e "evento" foram testados e REJEITADOS, pois tiravam obra de verdade
    # ("vias de acesso para veículos", "demolição e remoção de resíduos", "Parque de Eventos").
    - "tenda*"
    - "natalina"
    - "banheiro* quimico*"
    - "informatica"
    - "drone*"
  # Como as palavras aparecem no painel (o texto dos editais é comparado sem acento).
  rotulos:
    "obra*": "obra"
    "reforma*": "reforma"
    "construcao": "construção"
    "edificac*": "edificação"
    "manutencao predial": "manutenção predial"
    "engenharia": "engenharia"
    "instalacoes eletricas": "instalações elétricas"
    "instalacoes hidraulicas": "instalações hidráulicas"
    "climatizacao": "climatização"
    "impermeabilizacao": "impermeabilização"
    "pavimentacao": "pavimentação"
    "demolicao": "demolição"
    "restauro": "restauro"
    "ampliacao": "ampliação"
    "recapeamento": "recapeamento"
    "calcamento": "calçamento"
    "muro*": "muro"
    "terraplenagem": "terraplenagem"
    "rede coletora": "rede coletora"
    "ar condicionado": "ar condicionado"
    "elevador*": "elevador"
    "pintura": "pintura"
    "hidraulic*": "hidráulica"
    "gerador*": "gerador"
    "subestacao": "subestação"
    "spda": "para-raios"
    "extintor*": "extintor"
    "telhado": "telhado"
    "cobertura": "cobertura"
    "piso*": "piso"
    "esquadria*": "esquadria"
    "calcada*": "calçada"
    "terraplanagem": "terraplenagem"
  # Compra ou locação: se a primeira palavra-núcleo do texto pede aquisição, fornecimento ou
  # locação, a nota é zero. Uma penalidade não basta: três termos fortes somam +70 e cobrem o -40.
  # Exceções: "fornecimento e instalação/aplicação..." é serviço; "fornecimento de materiais e mão
  # de obra" e "empreitada" são contrato de obra; e se uma palavra de obra vem ANTES ("execução de
  # obra, incluindo a aquisição de materiais"), o texto é obra. Medido em 21/10/2026.
  compra:
    termos:
      - termo: "aquisic*"
      - termo: "fornecimento"
        servico_se_seguido_de:
          [instalacao, montagem, implantacao, execucao, colocacao, manutencao, aplicacao]
        obra_se_texto_tem: ["mao de obra", "empreitada"]
      - termo: "locacao"
    abre_com: ["materiais", "material"]   # "Materiais para manutenção predial (134 itens)"
    nucleos_de_obra:
      - "execucao"
      - "obra*"
      - "servico*"
      - "reforma*"
      - "construcao"
      - "prestacao"
      - "manutencao"
      - "elaboracao"
      - "implantacao"
      - "instalacao"
      - "recuperacao"
      - "pavimentacao"
      - "demolicao"
      - "restauro"
      - "ampliacao"
      - "requalificacao"
      - "revitalizacao"
      - "empreitada"
  peso_forte: 35
  teto_fortes: 70
  peso_fraco: 8
  teto_fracos: 16
  penalidade_negativo: 40
  peso_uf:
    SP: 10
    RJ: 8
    MG: 8
    PR: 6
  peso_modalidade:
    4: 10
    5: 10
    6: 5
    7: 5
    8: 5
  bonus_valor_na_faixa: 15
  penalidade_valor_fora_faixa: 15

alerta:
  score_minimo: 40
  top_n: 10                 # quantos editais novos aparecem no resumo
  dias_prazo_proximo: 7     # "vencem esta semana": prazo até daqui a 7 dias
  prazo_minimo_dias: 2      # ...mas só os que ainda dão tempo de montar proposta (2 dias ou mais)
  max_vencendo: 5
  enviar_quando_vazio: true # manda uma linha mesmo sem novidades (prova que o robô rodou)

export:
  dias_historico: 90        # editais publicados nos últimos N dias vão para o editais.csv (dados abertos)
  dias_apos_encerramento: 7 # mantém no CSV editais que encerraram há até N dias
