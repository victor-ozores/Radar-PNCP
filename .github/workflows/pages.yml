name: Painel (GitHub Pages)

# Publica a página de site/ em https://<usuario>.github.io/Radar-PNCP/
# A página não embute dados: no navegador ela lê export/painel.json da branch `data`,
# que o pipeline diário atualiza. Por isso só precisa ser publicada de novo quando o código dela muda.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publicar no GitHub Pages
  id-token: write # exigido pelo deploy-pages para provar de onde veio o arquivo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
